openapi: 3.0.3
info:
  title: Transaction History Service
  description: >-
    Customer transaction-history HTTP API. Support search is available through a
    separate gRPC-only service and is not exposed by this OpenAPI document.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - bearerAuth: []
paths:
  /v1/transactions:
    get:
      operationId: ListTransactions
      summary: List the authenticated customer's transactions
      parameters:
        - name: startDate
          in: query
          description: Inclusive calendar date in Asia/Jakarta, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Inclusive calendar date in Asia/Jakarta, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: productCategory
          in: query
          schema:
            type: string
            enum: [transfer, ppob, cico]
        - name: productType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, UNKNOWN, SUCCESS, FAILED, NEED_REVIEW, REFUNDED]
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding page.
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Transaction page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/transactions/{transaction_id}:
    get:
      operationId: GetTransaction
      summary: Get one transaction for the authenticated customer
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeMetadata:
      type: object
      required: [status, response_code, message, request_id, timestamp]
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED, ERROR, PENDING]
        response_code: { type: string }
        message: { type: string }
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMetadata'
        - type: object
          properties:
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    TransactionSummary:
      type: object
      required: [transactionId, productCategory, productType, provider, direction, amount, feeAmount, totalAmount, currency, status, statusLabel, transactionAt]
      properties:
        transactionId: { type: string }
        productCategory: { type: string }
        productType: { type: string }
        provider: { type: string }
        providerName: { type: string }
        direction: { type: string, enum: [debit, credit] }
        denomination: { type: string }
        amount: { type: string, pattern: '^\d{1,16}(\.\d{1,2})?$' }
        feeAmount: { type: string, pattern: '^\d{1,16}(\.\d{1,2})?$' }
        totalAmount: { type: string, pattern: '^\d{1,16}(\.\d{1,2})?$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [PENDING, UNKNOWN, SUCCESS, FAILED, NEED_REVIEW, REFUNDED] }
        statusLabel: { type: string }
        destinationName: { type: string }
        destinationNoMasked: { type: string }
        transactionAt: { type: string, format: date-time }
    TransactionStatusHistory:
      type: object
      properties:
        toStatus: { type: string }
        statusLabel: { type: string }
        changedAt: { type: string, format: date-time }
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          properties:
            responseCode: { type: string }
            sourceAccountMasked: { type: string }
            referenceNo: { type: string }
            completedAt: { type: string, format: date-time, nullable: true }
            statusHistory:
              type: array
              items: { $ref: '#/components/schemas/TransactionStatusHistory' }
            detail:
              oneOf:
                - { $ref: '#/components/schemas/TransferDetail' }
                - { $ref: '#/components/schemas/PulsaDetail' }
                - { $ref: '#/components/schemas/DataPackageDetail' }
                - { $ref: '#/components/schemas/PlnPrepaidDetail' }
                - { $ref: '#/components/schemas/PlnPostpaidDetail' }
                - { $ref: '#/components/schemas/BpjsKesehatanDetail' }
                - { $ref: '#/components/schemas/CicoDetail' }
              nullable: true
    TransferDetail:
      type: object
      properties:
        bankCode: { type: string }
        note: { type: string }
    PulsaDetail:
      type: object
      properties:
        serialNumber: { type: string }
    DataPackageDetail:
      type: object
      properties:
        productName: { type: string }
        serialNumber: { type: string }
    PlnPrepaidDetail:
      type: object
      properties:
        token: { type: string }
        kwh: { type: string }
        tariffPower: { type: string }
    PlnPostpaidDetail:
      type: object
      properties:
        period: { type: string }
        standMeter: { type: string }
    BpjsKesehatanDetail:
      type: object
      properties:
        periodMonths: { type: integer, minimum: 1, maximum: 24 }
        participantCount: { type: integer, minimum: 1, maximum: 50 }
        branch: { type: string }
    CicoDetail:
      type: object
      properties:
        codeMasked: { type: string }
        warkatNo: { type: string }
    ListTransactionsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TransactionSummary' }
        nextCursor: { type: string }
    GetTransactionResponse:
      type: object
      properties:
        transaction: { $ref: '#/components/schemas/TransactionDetail' }
    ListTransactionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMetadata'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListTransactionsResponse' }
    GetTransactionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMetadata'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/GetTransactionResponse' }
  responses:
    InvalidRequest:
      description: Invalid request (`CORE-1000`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Authentication required (`CORE-1001`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Transaction not found for this owner (`CORE-1004`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Internal service error (`CORE-9000`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
