syntax = "proto3";

package history.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yogayulanda/transaction-history-service/gen/go/history/v1;historyv1";

service HistoryService {
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = { get: "/v1/transactions" };
  }

  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {
    option (google.api.http) = { get: "/v1/transactions/{transaction_id}" };
  }
}

message ListTransactionsRequest {
  string start_date = 1;
  string end_date = 2;
  string product_category = 3;
  string product_type = 4;
  string status = 5;
  string cursor = 6;
  int32 page_size = 7;
}

message ListTransactionsResponse {
  repeated TransactionSummary items = 1;
  string next_cursor = 2;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  TransactionDetail transaction = 1;
}

message TransactionSummary {
  string transaction_id = 1;
  string product_category = 2;
  string product_type = 3;
  string provider = 4;
  string provider_name = 5;
  string direction = 6;
  string denomination = 7;
  string amount = 8;
  string fee_amount = 9;
  string total_amount = 10;
  string currency = 11;
  string status = 12;
  string status_label = 13;
  string destination_name = 14;
  string destination_no_masked = 15;
  google.protobuf.Timestamp transaction_at = 16;
}

message TransactionDetail {
  string transaction_id = 1;
  string product_category = 2;
  string product_type = 3;
  string provider = 4;
  string provider_name = 5;
  string direction = 6;
  string denomination = 7;
  string amount = 8;
  string fee_amount = 9;
  string total_amount = 10;
  string currency = 11;
  string status = 12;
  string status_label = 13;
  string destination_name = 14;
  string destination_no_masked = 15;
  google.protobuf.Timestamp transaction_at = 16;
  string response_code = 17;
  string source_account_masked = 18;
  string reference_no = 19;
  google.protobuf.Timestamp completed_at = 20;
  repeated TransactionStatusHistory status_history = 21;
  oneof detail {
    TransferDetail transfer = 22;
    PulsaDetail pulsa = 23;
    DataPackageDetail data_package = 24;
    PlnPrepaidDetail pln_prepaid = 25;
    PlnPostpaidDetail pln_postpaid = 26;
    BpjsKesehatanDetail bpjs_kesehatan = 27;
    CicoDetail cico = 28;
  }
}

message TransactionStatusHistory {
  string to_status = 1;
  string status_label = 2;
  google.protobuf.Timestamp changed_at = 3;
}

message TransferDetail { string bank_code = 1; string note = 2; }
message PulsaDetail { string serial_number = 1; }
message DataPackageDetail { string product_name = 1; string serial_number = 2; }
message PlnPrepaidDetail { string token = 1; string kwh = 2; string tariff_power = 3; }
message PlnPostpaidDetail { string period = 1; string stand_meter = 2; }
message BpjsKesehatanDetail { int32 period_months = 1; int32 participant_count = 2; string branch = 3; }
message CicoDetail { string code_masked = 1; string warkat_no = 2; }
